name: Human Foundation Actions Probe

'on':
  push:
    branches:
      - human-foundation-actions-probe-v0.2.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner startup
        shell: bash
        run: |
          set -euo pipefail
          echo "runner-started=true"
          python3 --version
          curl --version | head -1
