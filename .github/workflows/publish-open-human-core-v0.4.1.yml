name: Publish Open Human Core v0.4.1 runtime verification

on:
  push:
    branches:
      - open-human-core-v0.4.1
    paths:
      - 'open-human-core-v0.4.1-audit-corrected/scripts/**'
      - 'open-human-core-v0.4.1-audit-corrected/manifests/**'
      - 'open-human-core-v0.4.1-audit-corrected/requirements.txt'
      - 'open-human-core-v0.4.1-audit-corrected/package.json'
      - 'open-human-core-v0.4.1-audit-corrected/EXPECTED_SHA256SUMS.txt'
      - 'open-human-core-v0.4.1-audit-corrected/README.md'
      - '.github/workflows/publish-open-human-core-v0.4.1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-human-core-v0.4.1-publish
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-human-core-v0.4.1-audit-corrected

    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          ref: open-human-core-v0.4.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: open-human-core-v0.4.1-audit-corrected/requirements.txt

      - name: Materialize exact deterministic generator
        run: python scripts/materialize_generator.py

      - name: Install deterministic geometry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Regenerate all repaired GLBs
        run: python scripts/generate_owned_humanoid.py --all-lods --report reports/build.json

      - name: Verify exact posted SHA-256 values
        run: sha256sum -c EXPECTED_SHA256SUMS.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: open-human-core-v0.4.1-audit-corrected/package.json

      - name: Install pinned Three.js
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run real GLTFLoader, AnimationMixer, and SkeletonUtils validator
        run: npm run validate

      - name: Normalize public validation receipt
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const source = JSON.parse(fs.readFileSync('reports/threejs-runtime-result.json', 'utf8'));
          const result = {
            schema_version: 1,
            validator: source.validator,
            passed: source.passed,
            package_resolution: {
              available: source.package_resolution?.available === true,
              three_revision: source.package_resolution?.three_revision ?? null
            },
            assets: (source.assets ?? []).map((asset) => ({
              input: path.basename(asset.input),
              parsed_by_GLTFLoader: asset.parsed_by_GLTFLoader,
              skinned_meshes: asset.skinned_meshes,
              morph_targets: asset.morph_targets,
              clips_executed_with_AnimationMixer: asset.clips_executed_with_AnimationMixer,
              independent_clones_created: asset.independent_clones_created,
              passed: asset.passed
            })),
            boundary: source.boundary
          };
          fs.writeFileSync('reports/threejs-runtime-result.public.json', `${JSON.stringify(result, null, 2)}\n`);
          if (!result.passed) process.exit(2);
          NODE

      - name: Create deterministic public bundle
        run: |
          python <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.').resolve()
          output = root / 'open-human-core-v0.4.1-threejs-validation.zip'
          files = [
              Path('README.md'),
              Path('package.json'),
              Path('package-lock.json'),
              Path('requirements.txt'),
              Path('EXPECTED_SHA256SUMS.txt'),
              Path('scripts/threejs_runtime_validate.mjs'),
              Path('scripts/generate_owned_humanoid.py'),
              Path('manifests/canonical-skeleton.yaml'),
              Path('assets/runtime/humans/human_core_01.glb'),
              Path('assets/runtime/humans/human_core_01_lod1.glb'),
              Path('assets/runtime/humans/human_core_01_lod2.glb'),
              Path('reports/threejs-runtime-result.public.json'),
          ]
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for relative in files:
                  data = (root / relative).read_bytes()
                  info = zipfile.ZipInfo(str(Path('open-human-core-v0.4.1-audit-corrected') / relative))
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          sha256sum open-human-core-v0.4.1-threejs-validation.zip > open-human-core-v0.4.1-threejs-validation.zip.sha256

      - name: Commit generated public files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/runtime/humans/*.glb \
            reports/threejs-runtime-result.public.json \
            package-lock.json
          if git diff --cached --quiet; then
            echo 'Generated files already match the committed public files.'
          else
            git commit -m 'build: publish v0.4.1 GLBs and Three.js validation receipt'
            git push origin HEAD:open-human-core-v0.4.1
          fi

      - name: Publish cookie-free GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: open-human-core-v0.4.1-audit-corrected
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              open-human-core-v0.4.1-threejs-validation.zip \
              open-human-core-v0.4.1-threejs-validation.zip.sha256 \
              assets/runtime/humans/human_core_01.glb \
              assets/runtime/humans/human_core_01_lod1.glb \
              assets/runtime/humans/human_core_01_lod2.glb \
              scripts/threejs_runtime_validate.mjs \
              reports/threejs-runtime-result.public.json \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              open-human-core-v0.4.1-threejs-validation.zip \
              open-human-core-v0.4.1-threejs-validation.zip.sha256 \
              assets/runtime/humans/human_core_01.glb \
              assets/runtime/humans/human_core_01_lod1.glb \
              assets/runtime/humans/human_core_01_lod2.glb \
              scripts/threejs_runtime_validate.mjs \
              reports/threejs-runtime-result.public.json \
              --target "$HEAD_SHA" \
              --title 'Open Human Core v0.4.1 Audit-Corrected Runtime Verification' \
              --notes 'Public, cookie-free repaired GLBs plus the real Three.js GLTFLoader, AnimationMixer, and SkeletonUtils.clone validator. The normalized receipt is generated only after the validator exits successfully.' \
              --repo "$GITHUB_REPOSITORY"
          fi
